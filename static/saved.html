<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BringMeJobs · Saved Jobs</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="/">BringMeJobs</a>
      <nav>
        <a class="nav-link" href="/">Discovery</a>
        <a class="nav-link active" href="/saved">Saved Jobs</a>
        <a class="nav-link" href="/config">Config</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="page-heading">
      <div>
        <h2>Saved jobs</h2>
        <p>Listings you chose to keep.</p>
      </div>
    </section>
    <div id="notice" class="notice" hidden></div>
    <section class="toolbar jobs-toolbar">
      <div class="job-controls">
        <label>Filter jobs<input id="job-search" type="search" placeholder="Title, company, or location"></label>
        <label>Sort by
          <select id="job-sort">
            <option value="posted-desc">Newest posted</option>
            <option value="posted-asc">Oldest posted</option>
            <option value="score-desc">Best match</option>
            <option value="company-asc">Company A to Z</option>
          </select>
        </label>
      </div>
    </section>
    <section id="saved-jobs" class="jobs"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
