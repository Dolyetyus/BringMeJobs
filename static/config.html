<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BringMeJobs · Config</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar"><div class="brand"><a href="/">BringMeJobs</a><nav><a class="nav-link" href="/">Discovery</a><a class="nav-link" href="/saved">Saved Jobs</a><a class="nav-link active" href="/config">Config</a></nav></div><div class="header-actions"><button id="check-health" class="secondary"><svg aria-hidden="true"><use href="#icon-health"></use></svg>Check access</button><button id="save-config"><svg aria-hidden="true"><use href="#icon-save"></use></svg>Save changes</button></div></header>
  <main>
    <section class="page-heading"><div><h2>Company sources</h2><p>Configure the official careers pages used by the daily search.</p></div><button id="add-company" class="secondary"><svg aria-hidden="true"><use href="#icon-plus"></use></svg>Add company</button></section>
    <div id="notice" class="notice" hidden></div>
    <section class="panel filter-panel">
      <div class="panel-heading"><h3>Job title filters</h3></div>
      <div class="filter-grid">
        <label>Include patterns
          <input id="include-terms" placeholder="engineer, AI, software">
        </label>
        <label>Exclude patterns
          <input id="exclude-terms" placeholder="*intern*,*graduate*">
        </label>
      </div>
      <p class="muted">Comma-separated title patterns. Wildcards such as <code>*intern*</code> are supported.</p>
    </section>
    <section class="panel config-panel"><div class="config-head"><span>Company</span><span>Careers page or feed</span><span>Type</span><span>Access</span><span></span></div><div id="company-rows"></div></section>
  </main>
  <svg class="icon-sprite" aria-hidden="true"><symbol id="icon-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5zM8 4v6h8V4M8 20v-6h8v6M8 17h8"/></symbol><symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="icon-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M8 7l1-3h6l1 3m-9 0 1 13h8l-1-13"/></symbol><symbol id="icon-health" viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></symbol></svg>
  <script src="/app.js"></script>
</body>
</html>
